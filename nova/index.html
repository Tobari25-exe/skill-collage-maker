$('encode').onclick=encode;$('save').onclick=()=>{if(!encode())return;output.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='glyph-message.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});};async function loadImage(file){if(!file)return;const id=++loadId;$('decode').disabled=true;$('result').value='';if(sourceImage){sourceImage.close();sourceImage=null;}preview.hidden=true;$('emptyPreview').hidden=false;$('decodeStatus').textContent='画像を読み込み中…';try{const bitmap=await createImageBitmap(file);if(id!==loadId){bitmap.close();return;}sourceImage=bitmap;drawPreview(bitmap);$('decodeStatus').textContent='画像を読み込みました。';$('decode').disabled=false;}catch{if(id!==loadId)return;$('decodeStatus').textContent='画像を読み込めませんでした。';}}
$('upload').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)loadImage(f);};
const dropZone=$('dropZone');for(let type of ['dragenter','dragover'])dropZone.addEventListener(type,e=>{e.preventDefault();dropZone.classList.add('dragover');if(e.dataTransfer)e.dataTransfer.dropEffect='copy';});dropZone.addEventListener('dragleave',e=>{if(!dropZone.contains(e.relatedTarget))dropZone.classList.remove('dragover');});dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('dragover');const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'))||e.dataTransfer.files[0];if(f){$('upload').value='';loadImage(f);}});
document.addEventListener('paste',e=>{const items=[...(e.clipboardData?.items||[])],files=[...(e.clipboardData?.files||[])];const f=items.find(i=>i.kind==='file'&&i.type.startsWith('image/'))?.getAsFile()||files.find(f=>f.type.startsWith('image/'));if(f){e.preventDefault();$('upload').value='';loadImage(f);}});
$('decode').onclick=()=>{if(sourceImage)safeAnalyze(sourceImage);};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('result').value);}catch{$('result').select();document.execCommand('copy');}};for(let ch of [...glyphOrder].filter(c=>/^[A-Za-z0-9]$/.test(c))){let el=document.createElement('div');el.className='glyph';el.innerHTML=glyphSVG(ch)+`<span>${ch}</span>`;$('alphabet').append(el);}
</script></body></html>
